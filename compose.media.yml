services:
  clamav:
    image: clamav/clamav:stable
    container_name: odiina-clamav
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - odiina-clamav-signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  media-worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: Dockerfile.media-worker
    env_file:
      - .env.local
    environment:
      SUPABASE_URL: http://host.docker.internal:54321
      ODIINA_CLAMAV_HOST: clamav
      ODIINA_FFMPEG_PATH: /usr/bin/ffmpeg
      ODIINA_FFPROBE_PATH: /usr/bin/ffprobe
    depends_on:
      clamav:
        condition: service_healthy
    mem_limit: 1536m
    cpus: 2
    pids_limit: 256
    tmpfs:
      - /tmp:size=768m,mode=1777
    restart: unless-stopped

volumes:
  odiina-clamav-signatures:
